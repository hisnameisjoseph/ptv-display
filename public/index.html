<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Melbourne Departures</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --board: #000000;        /* night board */
    --panel: #111111;
    --ink: #f5f5f5;          /* off-white text */
    --dim: #a7a7a7;          /* slate labels */
    --amber: #ffb300;        /* PIDS countdown amber */
    --live: #37c978;         /* realtime green */
    --train: #2a6fb8;        /* metro-ish blue */
    --bus: #e07020;          /* bus orange */
    --rule: #2a2a2a;
    --accent: #ffffff;

    /* Two type roles:
       --font-display : Public Sans, for badge / destination / countdown
       --font-ui      : Inter, for meta, "min", labels, menu, clock */
    --font-display: "Public Sans", system-ui, sans-serif;
    --font-ui: "Inter", system-ui, sans-serif;

    /* body padding, reused by the sticky header bleed */
    --pad: clamp(12px, 3vw, 28px);
    --pad-top: max(var(--pad), env(safe-area-inset-top));
    --pad-right: max(var(--pad), env(safe-area-inset-right));
    --pad-bottom: max(var(--pad), env(safe-area-inset-bottom));
    --pad-left: max(var(--pad), env(safe-area-inset-left));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--board);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    /* keep content clear of iPhone notch / home indicator */
    padding: var(--pad-top) var(--pad-right) var(--pad-bottom) var(--pad-left);
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 2.5vw, 22px);
  }

  /* Header: clock + walk filter + freshness.
     Sticky so the clock and controls stay visible if the page scrolls;
     negative margins bleed it over the body padding so rows slide
     underneath it cleanly. */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--board);
    margin: calc(-1 * var(--pad-top)) calc(-1 * var(--pad-right)) 0 calc(-1 * var(--pad-left));
    padding: var(--pad-top) var(--pad-right) 10px var(--pad-left);
  }
  #clock {
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: clamp(28px, 8vw, 44px);
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }
  #header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Walk-filter stepper: label toggles off; minus/plus nudge the value. */
  #walk {
    display: flex;
    align-items: center;
    gap: 2px;
    background: #1a1a1a;
    border: 1px solid var(--rule);
    border-radius: 6px;
    overflow: hidden;
  }
  #walk.on { border-color: #2c4a38; }
  #walk button {
    background: none;
    border: none;
    color: var(--dim);
    font: inherit;
    font-family: var(--font-ui);
    font-weight: 600;
    cursor: pointer;
    padding: 5px 9px;
    line-height: 1;
  }
  #walk button:hover { color: var(--ink); }
  #walk .step { font-size: 15px; min-width: 26px; }
  #walk-label {
    font-size: clamp(11px, 3vw, 13px);
    font-weight: 500;
    white-space: nowrap;
    padding: 5px 8px;
  }
  #walk.on #walk-label { color: var(--live); }
  /* Hide the steppers when the filter is off, so it reads as a single chip */
  #walk:not(.on) .step { display: none; }

  #freshness {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--dim);
    font-size: clamp(12px, 3.2vw, 15px);
    font-weight: 500;
  }
  #dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--live);
    animation: pulse 2.4s ease-in-out infinite;
  }
  #dot.stale { background: var(--amber); animation: none; }
  #dot.down { background: #d9534f; animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @media (prefers-reduced-motion: reduce) {
    #dot { animation: none; }
  }

  /* Board: stacked by default (portrait phone, desktop) */
  #board {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 2.5vw, 22px);
    flex: 1;
    min-height: 0;
  }

  /* Stop sections */
  section {
    position: relative; /* anchors the station menu */
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 10px;
    overflow: hidden;
  }
  section h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-ui);
    font-size: clamp(14px, 3.8vw, 18px);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--dim);
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--rule);
  }
  h2 .h2-name {
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2.picker .h2-name:hover { color: var(--ink); }
  h2 .caret { color: var(--dim); font-size: 0.85em; }

  /* Collapse chevron, right side of both train and bus headers (portrait) */
  .collapse-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--dim);
    font-size: 15px;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    transition: transform 0.15s ease;
  }
  .collapse-btn:hover { color: var(--ink); }
  .collapse-btn.collapsed { transform: rotate(-90deg); }

  /* Comfortable touch targets on phones */
  @media (orientation: portrait) {
    section h2 { min-height: 44px; }
    #walk button, #walk-label { min-height: 34px; display: flex; align-items: center; }
  }

  /* Collapsed bus sections (portrait): next times shown inline in the header.
     The times sit to the right, just before the collapse chevron. */
  .h2-times {
    margin-left: auto;
    display: flex;
    gap: 12px;
    font-family: var(--font-display);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-size: clamp(13px, 3.6vw, 16px);
    color: var(--amber);
    letter-spacing: 0;
    text-transform: none;
    white-space: nowrap;
  }
  /* When the times are present, they take the auto margin, so the collapse
     button shouldn't also push left. */
  .h2-times + .collapse-btn { margin-left: 10px; }
  .h2-times.none { color: var(--dim); font-family: var(--font-ui); font-weight: 500; }

  .station-menu {
    position: absolute;
    top: 38px;
    left: 10px;
    z-index: 50;
    background: #1a1a1a;
    border: 1px solid var(--rule);
    border-radius: 8px;
    min-width: 260px;
    max-height: min(64vh, 380px);
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
    overflow: hidden;
  }
  .station-search {
    border: none;
    border-bottom: 1px solid var(--rule);
    background: #222;
    color: var(--ink);
    font: inherit;
    font-family: var(--font-ui);
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
  }
  .station-search::placeholder { color: #6d6d6d; }
  .station-list { overflow-y: auto; }
  .station-menu button.opt {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 14px;
    background: none;
    border: none;
    border-bottom: 1px solid #222;
    color: var(--ink);
    font: inherit;
    font-family: var(--font-ui);
    font-size: 14px;
    cursor: pointer;
  }
  .station-menu button.opt:last-child { border-bottom: none; }
  .station-menu button.opt:hover,
  .station-menu button.opt.highlight { background: #262626; }
  .station-menu button.opt.active { color: var(--amber); }
  .station-menu .no-match {
    padding: 12px 14px;
    color: var(--dim);
    font-size: 13px;
  }

  .row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
  }
  .rows > .row:last-child,
  .col > .row:last-child { border-bottom: none; }

  /* Direction-split train columns (grid layout only) */
  .rows.split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: stretch;
  }
  .rows.split .col:first-child { border-right: 1px solid var(--rule); }
  .col h3 {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--dim);
    padding: 5px 10px 4px;
    border-bottom: 1px solid var(--rule);
  }

  /* Direction-split train groups, stacked (portrait layout) */
  .rows.stacked-split .col h3 {
    padding: 7px 14px 6px;
  }
  .rows.stacked-split .col:not(:first-child) h3 {
    border-top: 1px solid var(--rule);
  }

  .badge {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(13px, 3.6vw, 16px);
    padding: 3px 8px;
    border-radius: 5px;
    color: #fff;
    min-width: 2.6em;
    text-align: center;
  }
  .badge.train { background: var(--train); }
  .badge.bus { background: var(--bus); }

  .dest {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .dest .name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(16px, 4.6vw, 21px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dest .meta {
    font-family: var(--font-ui);
    color: var(--dim);
    font-size: clamp(11px, 3vw, 13px);
    font-weight: 400;
  }

  .mins {
    font-family: var(--font-display);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: clamp(24px, 7.5vw, 36px);
    color: var(--amber);
    text-align: right;
    line-height: 1;
  }
  .mins small {
    display: block;
    font-family: var(--font-ui);
    font-size: clamp(10px, 2.6vw, 12px);
    font-weight: 500;
    color: var(--dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .mins.now { color: var(--live); }

  .empty, .error {
    padding: 14px;
    color: var(--dim);
    font-size: clamp(13px, 3.6vw, 15px);
  }
  .error { color: #d98380; }

  /* ---- Wall-display layout: trains left, buses stacked right ----
     Triggered by landscape orientation on a wide-enough viewport.
     This is the "ambient board" mode (spare phone in landscape, or a
     monitor). Portrait and narrow windows use the stacked decision view. */
  @media (orientation: landscape) and (min-width: 700px) {
    body { gap: 10px; }
    #clock { font-size: 16px; }
    #freshness { font-size: 11px; }
    #walk-label { font-size: 10px; }
    #board {
      display: grid;
      grid-template-columns: 1.75fr 1fr;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "train bus-city"
        "train bus-west";
      gap: 10px;
    }
    section { min-height: 0; }              /* let grid constrain height */
    section[data-key="train"]    { grid-area: train; }
    section[data-key="bus-city"] { grid-area: bus-city; }
    section[data-key="bus-west"] { grid-area: bus-west; }

    /* compact density so more rows fit */
    section h2 { font-size: 12px; padding: 6px 10px 5px; }
    .station-menu { top: 30px; }
    .row { padding: 5px 10px; gap: 8px; }
    .badge { font-size: 12px; padding: 2px 6px; }
    .dest .name { font-size: 17px; }
    .dest .meta { font-size: 8px; }
    .mins { font-size: 19px; }
    .mins small { font-size: 8px; }
    .col h3 { font-size: 9px; padding: 4px 10px 3px; }
    /* the collapse control is a portrait affordance; hide on the wall board */
    .collapse-btn { display: none; }
  }
</style>
</head>
<body>
  <header>
    <div id="clock">--:--</div>
    <div id="header-right">
      <div id="walk">
        <button type="button" class="step" id="walk-minus" aria-label="Less walk time">&minus;</button>
        <span id="walk-label">Walk filter</span>
        <button type="button" class="step" id="walk-plus" aria-label="More walk time">+</button>
      </div>
      <div id="freshness"><span id="dot"></span><span id="updated">connecting</span></div>
    </div>
  </header>
  <main id="board"></main>

<script>
const REFRESH_MS = 45_000;
const TZ = "Australia/Melbourne";

// Walk-filter minute stops the +/- buttons snap between. 0 means "off".
const WALK_STOPS = [0, 3, 5, 8, 10, 15];
const WALK_DEFAULT = 5;

// ---- Portrait ("decision view") display tuning ----------------------------
const PORTRAIT = {
  trainPerGroup: 3,   // rows per direction group
  trainSingleList: 5, // fallback cap if a station has no split config
  busSummaryTimes: 2, // departure times shown inline in a collapsed bus header
  busExpandedRows: 4, // rows when a bus section is tapped open
};

// ---- Station registry (keys must match the Worker) ------------------------
// split: null -> single chronological list.
// split: { left: {label, test?, field?}, right: {label, test?, field?} }
//   Exactly one side carries a regex test; the other side is the fallback.
//   field: "destination" (default) or "route" - which value the regex tests.
//   cityWard: "left" | "right" - which side is the citybound side, where that
//   is meaningful. Portrait uses it to put the likely-wanted direction first.

const CITY_SPLIT = {
  left:  { label: "Outbound" },
  right: { label: "To City", test: /city|flinders/i },
  cityWard: "right",
};
const TUNNEL_SPLIT_NORTH = {
  left:  { label: "To Sunbury", test: /sunbury/i },
  right: { label: "To City / Cranbourne / Pakenham", test: /city|cranbourne|pakenham/i },
  cityWard: "right",
};
const TUNNEL_SPLIT_SOUTH = {
  left:  { label: "To City / Sunbury", test: /sunbury|city/i },
  right: { label: "To Cranbourne / Pakenham", test: /cranbourne|pakenham/i },
  cityWard: "left",
};
const SX_SPLIT = {
  left:  { label: "Red / Yellow / Dark Blue" },
  right: { label: "Frankston / Cross-City", test: /sandringham|frankston|werribee|williamstown/i, field: "route" },
};
const FLINDERS_SPLIT = {
  left:  { label: "Red / Yellow / Dark Blue" },
  right: {
    label: "Cross-City / Frankston",
    test: /werribee|williamstown|sandringham|sunbury|pakenham|cranbourne|frankston/i,
    field: "route",
  },
};
const MC_SPLIT = {
  left:  { label: "Red / Yellow / Dark Blue" },
  right: { label: "Metro Tunnel & Frankston", test: /sunbury|pakenham|cranbourne|frankston/i, field: "route" },
};
const NORTH_LOOP_SPLIT = {
  left:  { label: "Burnley / Craigieburn / Upfield" },
  right: { label: "Hurstbridge / Mernda / Frankston", test: /hurstbridge|mernda|frankston/i, field: "route" },
};

const STATIONS = {
  "footscray":         { label: "Footscray Station",                 split: CITY_SPLIT },
  "flinders-street":   { label: "Flinders St / Town Hall",           split: FLINDERS_SPLIT },
  "melbourne-central": { label: "Melbourne Central / State Library", split: MC_SPLIT },
  "southern-cross":    { label: "Southern Cross Station",            split: SX_SPLIT },
  "flagstaff":         { label: "Flagstaff Station",                 split: NORTH_LOOP_SPLIT },
  "parliament":        { label: "Parliament Station",                split: NORTH_LOOP_SPLIT },
  "anzac":             { label: "Anzac Station",                     split: TUNNEL_SPLIT_SOUTH },
  "parkville":         { label: "Parkville Station",                 split: TUNNEL_SPLIT_NORTH },
  "arden":             { label: "Arden Station",                     split: TUNNEL_SPLIT_NORTH },
  "richmond":          { label: "Richmond Station",                  split: CITY_SPLIT },
  "west-richmond":     { label: "West Richmond Station",             split: CITY_SPLIT },
  "jolimont":          { label: "Jolimont-MCG Station",              split: CITY_SPLIT },
  "south-yarra":       { label: "South Yarra Station",               split: CITY_SPLIT },
  "caulfield":         { label: "Caulfield Station",                 split: CITY_SPLIT },
  "newport":           { label: "Newport Station",                   split: CITY_SPLIT },
  "yarraville":        { label: "Yarraville Station",                split: CITY_SPLIT },
  "sunshine":          { label: "Sunshine Station",                  split: CITY_SPLIT },
  "werribee":          { label: "Werribee Station",                  split: CITY_SPLIT },
  "middle-footscray":  { label: "Middle Footscray",                  split: CITY_SPLIT },
  "west-footscray":    { label: "West Footscray",                    split: CITY_SPLIT },
  "hawksburn":         { label: "Hawksburn Station",                 split: CITY_SPLIT },
  "watergardens":      { label: "Watergardens Station",              split: CITY_SPLIT },
  "flemington-bridge": { label: "Flemington Bridge",                 split: CITY_SPLIT },
  "macaulay":          { label: "Macaulay Station",                  split: CITY_SPLIT },
};
const DEFAULT_STATION = "footscray";

// ---- Persisted per-device settings ----------------------------------------
function loadSetting(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v === null ? fallback : v;
  } catch { return fallback; }
}
function saveSetting(key, value) {
  try { localStorage.setItem(key, value); } catch { /* private mode etc. */ }
}

let currentStation = loadSetting("ptv-station", DEFAULT_STATION);
if (!(currentStation in STATIONS)) currentStation = DEFAULT_STATION;

// Walk filter is now a minute value (0 = off), cached like the station.
let walkMinutes = parseInt(loadSetting("ptv-walk-minutes", String(WALK_DEFAULT)), 10);
if (!Number.isFinite(walkMinutes) || walkMinutes < 0) walkMinutes = WALK_DEFAULT;

let menuOpen = false;
let stationQuery = "";       // text typed into the station search
let trainCollapsed = false;  // portrait: train section collapsed?
const expandedBuses = new Set();

// Display rules per stop (landscape grid layout).
const RULES = {
  "train":    { maxFill: 30 },
  "bus-city": { maxFill: 12 },
  "bus-west": { maxFill: 12 },
};
const DEFAULT_RULE = { maxFill: 12 };

// The walk filter only applies to trains (your walk to the station).
function hideWithinFor(stopKey) {
  return stopKey === "train" ? walkMinutes : 0;
}

const LINE_COLORS = {
  "Alamein":      { bg: "#152C6B", fg: "#ffffff" },
  "Belgrave":     { bg: "#152C6B", fg: "#ffffff" },
  "Craigieburn":  { bg: "#FFBE00", fg: "#111111" },
  "Cranbourne":   { bg: "#279FD5", fg: "#ffffff" },
  "Flemington":   { bg: "#95979A", fg: "#111111" },
  "Frankston":    { bg: "#028430", fg: "#ffffff" },
  "Glen Waverley":{ bg: "#152C6B", fg: "#ffffff" },
  "Hurstbridge":  { bg: "#BE1014", fg: "#ffffff" },
  "Lilydale":     { bg: "#152C6B", fg: "#ffffff" },
  "Mernda":       { bg: "#BE1014", fg: "#ffffff" },
  "Pakenham":     { bg: "#279FD5", fg: "#ffffff" },
  "Sandringham":  { bg: "#F178AF", fg: "#111111" },
  "Stony Point":  { bg: "#028430", fg: "#ffffff" },
  "Sunbury":      { bg: "#279FD5", fg: "#ffffff" },
  "Upfield":      { bg: "#FFBE00", fg: "#111111" },
  "Werribee":     { bg: "#F178AF", fg: "#111111" },
  "Williamstown": { bg: "#F178AF", fg: "#111111" },
};

function lineColor(routeName) {
  const name = (routeName || "").toLowerCase();
  for (const [line, c] of Object.entries(LINE_COLORS)) {
    if (name.includes(line.toLowerCase())) return c;
  }
  return null;
}

let lastPayload = null;

function melbTime(date) {
  return new Intl.DateTimeFormat("en-AU", {
    timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false,
  }).format(date);
}

function tickClock() {
  document.getElementById("clock").textContent = melbTime(new Date());
}
setInterval(tickClock, 1000);
tickClock();

function minutesUntil(iso) {
  return Math.round((new Date(iso) - Date.now()) / 60000);
}

function pickColumn(split, dep) {
  const valueFor = (side) =>
    (side.field === "route" ? dep.route : dep.destination) || "";
  if (split.left.test) return split.left.test.test(valueFor(split.left)) ? "left" : "right";
  if (split.right.test) return split.right.test.test(valueFor(split.right)) ? "right" : "left";
  return "left";
}

function orderedSides(split) {
  if (!split || !split.cityWard) return ["left", "right"];
  const morning = new Date().getHours() < 12;
  const first = morning
    ? split.cityWard
    : (split.cityWard === "left" ? "right" : "left");
  return first === "left" ? ["left", "right"] : ["right", "left"];
}

// Subsequence match: every char of query appears in order within the label.
// e.g. "mc" matches "Melbourne Central", "Macaulay", "Jolimont-MCG".
function subsequenceMatch(query, text) {
  const q = query.toLowerCase().replace(/\s+/g, "");
  if (!q) return true;
  const t = text.toLowerCase();
  let i = 0;
  for (const ch of t) {
    if (ch === q[i]) i++;
    if (i === q.length) return true;
  }
  return i === q.length;
}

function buildRow(stopKey, dep) {
  const bestIso = dep.estimatedUtc ?? dep.scheduledUtc;
  const mins = minutesUntil(bestIso);
  const hideWithin = hideWithinFor(stopKey);

  const row = document.createElement("div");
  row.className = "row";

  const badge = document.createElement("span");
  badge.className = "badge " + (stopKey === "train" ? "train" : "bus");
  badge.textContent = stopKey === "train" ? dep.route.charAt(0) : dep.route;
  if (stopKey === "train") {
    const c = lineColor(dep.route);
    if (c) {
      badge.style.background = c.bg;
      badge.style.color = c.fg;
    }
  }

  const dest = document.createElement("div");
  dest.className = "dest";
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = dep.destination;
  const meta = document.createElement("span");
  meta.className = "meta";
  const bits = [];
  if (dep.platform) bits.push("Platform " + dep.platform);
  bits.push(dep.estimatedUtc ? "Live" : "Scheduled");
  bits.push(melbTime(new Date(bestIso)));
  meta.textContent = bits.join(" · ");
  dest.append(name, meta);

  const minsEl = document.createElement("div");
  minsEl.className = "mins" + (mins <= hideWithin + 1 ? " now" : "");
  minsEl.innerHTML = mins + "<small>min</small>";

  row.append(badge, dest, minsEl);
  return row;
}

function trimOverflow(isGrid) {
  if (!isGrid) return;
  document.querySelectorAll("#board section").forEach((section) => {
    const rows = section.querySelector(".rows");
    if (!rows) return;
    const isSplit = rows.classList.contains("split");
    const cols = isSplit ? [...rows.querySelectorAll(".col")] : null;
    let guard = 80;
    while (guard-- > 0 && section.scrollHeight > section.clientHeight) {
      if (isSplit) {
        let target = null;
        let most = 0;
        for (const col of cols) {
          const n = col.querySelectorAll(".row").length;
          if (n > most) { most = n; target = col; }
        }
        if (!target || most === 0) break;
        const colRows = target.querySelectorAll(".row");
        colRows[colRows.length - 1].remove();
      } else {
        if (!rows.lastElementChild) break;
        rows.lastElementChild.remove();
      }
    }
  });
}

// Shared: a right-side collapse chevron. `collapsed` sets the rotated state;
// `onToggle` runs on click. Used by both train and bus headers so the
// collapse affordance is identical and can't drift between the two.
function makeCollapseButton(collapsed, onToggle) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "collapse-btn" + (collapsed ? " collapsed" : "");
  btn.textContent = "▾";
  btn.setAttribute("aria-label", collapsed ? "Expand" : "Collapse");
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    onToggle();
  });
  return btn;
}

// ---- Station picker menu (with search) -------------------------------------
function buildStationMenu(section) {
  const menu = document.createElement("div");
  menu.className = "station-menu";
  menu.addEventListener("click", (e) => e.stopPropagation());

  const search = document.createElement("input");
  search.className = "station-search";
  search.type = "text";
  search.placeholder = "Search stations";
  search.value = stationQuery;
  search.addEventListener("input", () => {
    stationQuery = search.value;
    refreshStationList(list);
  });
  search.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const first = list.querySelector("button.opt");
      if (first) first.click();
    } else if (e.key === "Escape") {
      menuOpen = false;
      stationQuery = "";
      render();
    }
  });

  const list = document.createElement("div");
  list.className = "station-list";

  menu.append(search, list);
  section.appendChild(menu);
  refreshStationList(list);

  // Autofocus so you can type immediately after opening
  setTimeout(() => search.focus(), 0);
}

function refreshStationList(list) {
  list.innerHTML = "";
  const entries = Object.entries(STATIONS).filter(([, cfg]) =>
    subsequenceMatch(stationQuery, cfg.label),
  );
  if (entries.length === 0) {
    const note = document.createElement("div");
    note.className = "no-match";
    note.textContent = "No stations match.";
    list.appendChild(note);
    return;
  }
  for (const [key, cfg] of entries) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt" + (key === currentStation ? " active" : "");
    btn.textContent = cfg.label;
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      menuOpen = false;
      stationQuery = "";
      if (key !== currentStation) {
        currentStation = key;
        saveSetting("ptv-station", key);
        document.getElementById("updated").textContent = "loading";
        refresh();
      } else {
        render();
      }
    });
    list.appendChild(btn);
  }
}

// Close the menu when tapping anywhere else
document.addEventListener("click", () => {
  if (menuOpen) {
    menuOpen = false;
    stationQuery = "";
    render();
  }
});

// ---- Section builders ------------------------------------------------------

function makeEmptyNote(text) {
  const div = document.createElement("div");
  div.className = "empty";
  div.textContent = text;
  return div;
}

function buildTrainGrid(section, stop, stationCfg) {
  const split = stationCfg.split;
  const cap = (RULES["train"] ?? DEFAULT_RULE).maxFill;
  const hideWithin = hideWithinFor("train");

  const rowsWrap = document.createElement("div");
  rowsWrap.className = "rows" + (split ? " split" : "");
  section.appendChild(rowsWrap);

  let colLeft = null;
  let colRight = null;
  if (split) {
    colLeft = document.createElement("div");
    colLeft.className = "col";
    const h3l = document.createElement("h3");
    h3l.textContent = split.left.label;
    colLeft.appendChild(h3l);

    colRight = document.createElement("div");
    colRight.className = "col";
    const h3r = document.createElement("h3");
    h3r.textContent = split.right.label;
    colRight.appendChild(h3r);

    rowsWrap.append(colLeft, colRight);
  }

  if (stop.error) {
    const div = document.createElement("div");
    div.className = "error";
    div.textContent = "Data unavailable. " + stop.error;
    (split ? colLeft : rowsWrap).appendChild(div);
    return;
  }

  let shown = 0;
  for (const dep of stop.departures) {
    if (shown >= cap) break;
    const bestIso = dep.estimatedUtc ?? dep.scheduledUtc;
    if (minutesUntil(bestIso) < hideWithin) continue;

    const row = buildRow("train", dep);
    if (split) {
      (pickColumn(split, dep) === "right" ? colRight : colLeft).appendChild(row);
    } else {
      rowsWrap.appendChild(row);
    }
    shown++;
  }
  if (shown === 0) {
    (split ? colLeft : rowsWrap).appendChild(
      makeEmptyNote("No catchable departures right now."),
    );
  } else if (split) {
    for (const col of [colLeft, colRight]) {
      if (!col.querySelector(".row")) col.appendChild(makeEmptyNote("No departures"));
    }
  }
}

function buildTrainStacked(section, stop, stationCfg) {
  const split = stationCfg.split;
  const hideWithin = hideWithinFor("train");

  const rowsWrap = document.createElement("div");
  rowsWrap.className = "rows" + (split ? " stacked-split" : "");
  section.appendChild(rowsWrap);

  if (stop.error) {
    const div = document.createElement("div");
    div.className = "error";
    div.textContent = "Data unavailable. " + stop.error;
    rowsWrap.appendChild(div);
    return;
  }

  if (!split) {
    let shown = 0;
    for (const dep of stop.departures) {
      if (shown >= PORTRAIT.trainSingleList) break;
      const bestIso = dep.estimatedUtc ?? dep.scheduledUtc;
      if (minutesUntil(bestIso) < hideWithin) continue;
      rowsWrap.appendChild(buildRow("train", dep));
      shown++;
    }
    if (shown === 0) rowsWrap.appendChild(makeEmptyNote("No catchable departures right now."));
    return;
  }

  const sides = orderedSides(split);
  const colBySide = {};
  for (const side of sides) {
    const col = document.createElement("div");
    col.className = "col";
    const h3 = document.createElement("h3");
    h3.textContent = split[side].label;
    col.appendChild(h3);
    rowsWrap.appendChild(col);
    colBySide[side] = col;
  }

  const counts = { left: 0, right: 0 };
  for (const dep of stop.departures) {
    if (counts.left >= PORTRAIT.trainPerGroup && counts.right >= PORTRAIT.trainPerGroup) break;
    const bestIso = dep.estimatedUtc ?? dep.scheduledUtc;
    if (minutesUntil(bestIso) < hideWithin) continue;
    const side = pickColumn(split, dep);
    if (counts[side] >= PORTRAIT.trainPerGroup) continue;
    colBySide[side].appendChild(buildRow("train", dep));
    counts[side]++;
  }

  for (const side of sides) {
    if (!colBySide[side].querySelector(".row")) {
      colBySide[side].appendChild(makeEmptyNote("No departures"));
    }
  }
}

function buildBusGrid(section, stop) {
  const cap = (RULES[stop.key] ?? DEFAULT_RULE).maxFill;
  const rowsWrap = document.createElement("div");
  rowsWrap.className = "rows";
  section.appendChild(rowsWrap);

  if (stop.error) {
    const div = document.createElement("div");
    div.className = "error";
    div.textContent = "Data unavailable. " + stop.error;
    rowsWrap.appendChild(div);
    return;
  }

  let shown = 0;
  for (const dep of stop.departures) {
    if (shown >= cap) break;
    if (minutesUntil(dep.estimatedUtc ?? dep.scheduledUtc) < 0) continue;
    rowsWrap.appendChild(buildRow(stop.key, dep));
    shown++;
  }
  if (shown === 0) rowsWrap.appendChild(makeEmptyNote("No catchable departures right now."));
}

// Portrait: bus section. Header shows the next times inline (when collapsed)
// and a right-side collapse chevron matching the train header. The chevron
// is the collapse control; tapping it toggles the detailed list.
function buildBusPortrait(section, stop, h2) {
  const expanded = expandedBuses.has(stop.key);

  const times = document.createElement("span");
  times.className = "h2-times";
  const catchable = (stop.departures ?? []).filter(
    (dep) => minutesUntil(dep.estimatedUtc ?? dep.scheduledUtc) >= 0,
  );
  if (stop.error) {
    times.classList.add("none");
    times.textContent = "no data";
  } else if (catchable.length === 0) {
    times.classList.add("none");
    times.textContent = "none";
  } else {
    for (const dep of catchable.slice(0, PORTRAIT.busSummaryTimes)) {
      const chip = document.createElement("span");
      const mins = minutesUntil(dep.estimatedUtc ?? dep.scheduledUtc);
      chip.textContent = dep.route + " " + mins + "m";
      times.appendChild(chip);
    }
  }

  // Collapsed = not expanded, so the chevron shows the rotated (collapsed)
  // state when the section is closed.
  const collapse = makeCollapseButton(!expanded, () => {
    if (expandedBuses.has(stop.key)) expandedBuses.delete(stop.key);
    else expandedBuses.add(stop.key);
    render();
  });

  h2.append(times, collapse);

  if (!expanded) return;

  const rowsWrap = document.createElement("div");
  rowsWrap.className = "rows";
  section.appendChild(rowsWrap);

  if (stop.error) {
    const div = document.createElement("div");
    div.className = "error";
    div.textContent = "Data unavailable. " + stop.error;
    rowsWrap.appendChild(div);
    return;
  }
  const shownDeps = catchable.slice(0, PORTRAIT.busExpandedRows);
  for (const dep of shownDeps) rowsWrap.appendChild(buildRow(stop.key, dep));
  if (shownDeps.length === 0) rowsWrap.appendChild(makeEmptyNote("No departures"));
}

function render() {
  if (!lastPayload) return;
  const board = document.getElementById("board");
  board.innerHTML = "";

  const isGrid = getComputedStyle(board).display === "grid";
  const stationCfg = STATIONS[currentStation] ?? STATIONS[DEFAULT_STATION];

  for (const stop of lastPayload.stops) {
    const isTrain = stop.key === "train";

    const section = document.createElement("section");
    section.dataset.key = stop.key;

    const h2 = document.createElement("h2");

    // The name area is its own element so the collapse chevron can sit apart.
    const nameEl = document.createElement("span");
    nameEl.className = "h2-name";

    if (isTrain) {
      h2.className = "picker";
      const nameSpan = document.createElement("span");
      nameSpan.textContent = stationCfg.label;
      const caret = document.createElement("span");
      caret.className = "caret";
      caret.textContent = "▾";
      nameEl.append(nameSpan, caret);
      // Tapping the station name opens the picker (not the collapse).
      nameEl.addEventListener("click", (e) => {
        e.stopPropagation();
        menuOpen = !menuOpen;
        if (!menuOpen) stationQuery = "";
        render();
      });
      h2.appendChild(nameEl);

      // Collapse chevron on the right (portrait affordance; hidden on wall board).
      if (!isGrid) {
        const collapse = makeCollapseButton(trainCollapsed, () => {
          trainCollapsed = !trainCollapsed;
          render();
        });
        h2.appendChild(collapse);
      }
    } else {
      const labelSpan = document.createElement("span");
      labelSpan.textContent = stop.label;
      nameEl.appendChild(labelSpan);
      h2.appendChild(nameEl);
    }
    section.appendChild(h2);

    if (isTrain) {
      const showBody = isGrid || !trainCollapsed;
      if (showBody) {
        if (isGrid) buildTrainGrid(section, stop, stationCfg);
        else buildTrainStacked(section, stop, stationCfg);
      }
    } else {
      if (isGrid) buildBusGrid(section, stop);
      else buildBusPortrait(section, stop, h2);
    }

    if (isTrain && menuOpen) buildStationMenu(section);
    board.appendChild(section);
  }

  trimOverflow(isGrid);
  updateWalkUI();
}

// ---- Walk filter stepper ----------------------------------------------------
function updateWalkUI() {
  const wrap = document.getElementById("walk");
  const label = document.getElementById("walk-label");
  const on = walkMinutes > 0;
  wrap.classList.toggle("on", on);
  label.textContent = on ? "Walk " + walkMinutes + " min" : "Walk filter: off";
}

function setWalkMinutes(v) {
  walkMinutes = Math.max(0, v);
  saveSetting("ptv-walk-minutes", String(walkMinutes));
  render();
}

// +/- snap to the nearest stop in WALK_STOPS, so tapping cycles sensibly
function nudgeWalk(dir) {
  const stops = WALK_STOPS;
  let idx = stops.indexOf(walkMinutes);
  if (idx === -1) {
    let nearest = 0, best = Infinity;
    stops.forEach((s, i) => {
      const d = Math.abs(s - walkMinutes);
      if (d < best) { best = d; nearest = i; }
    });
    idx = nearest;
  } else {
    idx = Math.min(stops.length - 1, Math.max(0, idx + dir));
  }
  setWalkMinutes(stops[idx]);
}

document.getElementById("walk-minus").addEventListener("click", (e) => {
  e.stopPropagation();
  nudgeWalk(-1);
});
document.getElementById("walk-plus").addEventListener("click", (e) => {
  e.stopPropagation();
  nudgeWalk(+1);
});
// Tapping the label toggles the filter off/on (remembers last value)
let lastWalkValue = walkMinutes > 0 ? walkMinutes : WALK_DEFAULT;
document.getElementById("walk-label").addEventListener("click", (e) => {
  e.stopPropagation();
  if (walkMinutes > 0) {
    lastWalkValue = walkMinutes;
    setWalkMinutes(0);
  } else {
    setWalkMinutes(lastWalkValue);
  }
});
updateWalkUI();

async function refresh() {
  const dot = document.getElementById("dot");
  const updated = document.getElementById("updated");
  try {
    const res = await fetch("/api/board?station=" + encodeURIComponent(currentStation));
    if (!res.ok) throw new Error("HTTP " + res.status);
    lastPayload = await res.json();
    dot.className = "";
    updated.textContent = "Updated " + melbTime(new Date());
  } catch (err) {
    dot.className = "down";
    updated.textContent = "connection lost";
  }
  render();
}

refresh();
setInterval(refresh, REFRESH_MS);
setInterval(() => { if (!menuOpen) render(); }, 20_000);

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (!menuOpen) render(); }, 200);
});

// ---- Keep the screen awake on supported browsers (iOS 16.4+) ----
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (err) { /* not critical */ }
}
requestWakeLock();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
});
</script>
