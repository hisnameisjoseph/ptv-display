<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Melbourne Departures</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div id="clock">--:--</div>
    <div id="header-right">
      <div id="walk">
        <button type="button" class="step" id="walk-minus" aria-label="Less walk time">&minus;</button>
        <span id="walk-label">Walk filter</span>
        <button type="button" class="step" id="walk-plus" aria-label="More walk time">+</button>
      </div>
      <div id="freshness"><span id="dot"></span><span id="updated">connecting</span></div>
    </div>
  </header>
  <main id="board"></main>

  <script src="/app.js"></script>
</body>
</html>
